<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メダル工房 - Emblem Color Craft</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      background-color: #fff9e2;
      margin: 0;
      padding: 0;
    }
    #root {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .color-chip {
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .color-chip:hover {
      transform: scale(1.15);
    }
  </style>

  <script>
    window.addEventListener('error', function(event) {
      const root = document.getElementById('root');
      if (root) {
        root.innerHTML = '<div style="color:#dc2626; padding:40px; font-family:sans-serif; text-align:center;">' +
                         '<h2 style="font-weight:bold; font-size:1.5rem; margin-bottom:10px;">JavaScriptエラーが発生しました</h2>' +
                         '<p>' + event.message + '</p>' +
                         '<p style="margin-top:20px; font-size:0.9rem; color:#64748b;">ファイルの文字コードが「UTF-8」で保存されているか確認してください。</p>' +
                         '</div>';
      }
    });
  </script>
</head>
